[project]
name = "renai-embedding-service"
version = "0.1.0"
description = "Renai Embedding Service - Ollama embeddings"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "ollama>=0.2.0",
    "numpy>=1.26.0",
    "renai-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
