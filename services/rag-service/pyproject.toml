[project]
name = "renai-rag-service"
version = "0.1.0"
description = "Renai RAG Service - RAG pipeline with Celery tasks"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "celery[redis]>=5.3.0",
    "qdrant-client>=1.9.0",
    "renai-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
