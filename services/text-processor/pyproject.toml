[project]
name = "text-processor"
version = "0.1.0"
description = "Text processing service for chunking and transformation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "tiktoken>=0.5.0",
    "langchain-text-splitters>=0.0.1",
    "unstructured>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
