[project]
name = "renai-shared"
version = "0.1.0"
description = "Shared utilities for Renai microservices"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
